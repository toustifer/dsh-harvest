name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/backends.js && node --check lib/extract.js && node --check lib/http.js
      - name: Smoke test
        run: node test/smoke.mjs
